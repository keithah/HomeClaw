name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify HomeKit entitlement
        run: |
          if ! grep -q 'com.apple.developer.homekit' Resources/HomeClaw.entitlements; then
            echo "::error::HomeKit entitlement missing from HomeClaw.entitlements — readValue() will silently fail"
            exit 1
          fi

      - name: Build homeclaw-cli
        run: swift build --product homeclaw-cli

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build MCP server
        run: npm run build:mcp

  version-check:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check all version sources agree
        run: ./scripts/check-versions.sh
